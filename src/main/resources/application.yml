spring:
  application:
    name: ajo-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Filtered from the pom at build time by spring-boot-starter-parent (@…@ delimiters).
info:
  app:
    version: '@project.version@'

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 30