server:
  port: ${PORT:8080}

spring:
  application:
    name: ajo-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Only health is exposed. /actuator/health includes the database check and shows the real
# status; Render's health check points at /actuator/health/liveness, which does not touch
# the database, so a Neon cold start cannot fail a deploy or trigger a restart.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Filtered from the pom at build time by spring-boot-starter-parent (@…@ delimiters).
info:
  app:
    version: '@project.version@'

# No default on purpose: the app refuses to start without it.
# A base64-encoded key of at least 256 bits, e.g. `openssl rand -base64 64`.
jwt:
  secret: ${JWT_SECRET}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 30

app:
  cors:
    # Comma-separated list of exact origins, e.g. https://ajo.example.com,https://www.ajo.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # One-time SMS codes. Not secrets; defaults also live in OtpProperties.
  otp:
    code-length: 6
    ttl: 10m
    max-attempts: 5
    max-requests-per-window: 3
    request-window: 1h
    resend-cooldown: 60s
